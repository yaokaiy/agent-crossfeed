<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="left"><rect x="184" y="212" width="232" height="600" rx="116"/></clipPath>
    <clipPath id="right"><rect x="608" y="212" width="232" height="600" rx="116"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="#101A2E"/>
  <!-- fuel: left tank nearly empty (amber), right tank three quarters full (teal) -->
  <rect x="184" y="664" width="232" height="148" fill="#F5A524" clip-path="url(#left)"/>
  <rect x="608" y="368" width="232" height="444" fill="#2CC8B4" clip-path="url(#right)"/>
  <!-- crossfeed pipe -->
  <line x1="416" y1="690" x2="608" y2="690" stroke="#EEF2F7" stroke-width="40" stroke-linecap="butt"/>
  <!-- tanks -->
  <rect x="184" y="212" width="232" height="600" rx="116" fill="none" stroke="#EEF2F7" stroke-width="40"/>
  <rect x="608" y="212" width="232" height="600" rx="116" fill="none" stroke="#EEF2F7" stroke-width="40"/>
  <!-- open valve -->
  <circle cx="512" cy="690" r="78" fill="#EEF2F7"/>
  <rect x="462" y="672" width="100" height="36" rx="18" fill="#101A2E"/>
</svg>
